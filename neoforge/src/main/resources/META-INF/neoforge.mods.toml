# NeoForge 21.1 (1.21.1) still names its mod loader here; 26.x dropped these two keys.
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/gabmaybelle/beyond-the-dragon/issues"

[[mods]]
modId = "beyond_the_dragon"
version = "${version}"
displayName = "Beyond the Dragon"
authors = "Gabby"
description = '''A reason to keep playing after the Ender Dragon: ruins at the edge of the End, a dragon that gets harder every time, and a metal that only exists far from home.'''
displayURL = "https://github.com/gabmaybelle/beyond-the-dragon"
logoFile = "assets/beyond_the_dragon/icon.png"

[[mixins]]
config = "beyond_the_dragon.mixins.json"

[[dependencies.beyond_the_dragon]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.beyond_the_dragon]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"
