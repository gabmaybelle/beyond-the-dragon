plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"beyond_the_dragon" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compatibility runs: `./gradlew :fabric:runClientGameTest -PtestBetterEnd` (or -PtestStellarity,
	// -PtestNullscape) plays the in-game test with that mod installed, fetched from Modrinth's maven
	// by version id. Nothing here is bundled or required.
	if (project.hasProperty("testBetterEnd")) {
		runtimeOnly "maven.modrinth:betterend:${project.betterend_version}"
		runtimeOnly "maven.modrinth:bclib:${project.bclib_version}"
		runtimeOnly "maven.modrinth:worldweaver:${project.worldweaver_version}"
	}
	if (project.hasProperty("testStellarity")) {
		runtimeOnly "maven.modrinth:stellarity:${project.stellarity_version}"
	}
	if (project.hasProperty("testNullscape")) {
		runtimeOnly "maven.modrinth:nullscape:${project.nullscape_version}"
	}
	// Waystones: a restored observatory sets a waystone when it's installed (reached through its
	// API by reflection, so it's never needed to build). -PtestWaystones checks it.
	if (project.hasProperty("testWaystones")) {
		runtimeOnly "maven.modrinth:waystones:${project.waystones_version}"
		runtimeOnly "maven.modrinth:balm:${project.balm_version}"
		runtimeOnly "maven.modrinth:shogi:${project.shogi_version}"
	}
	// Recipe viewers (each with what it needs): the recipes are plain crafting and smithing
	// JSON, so a viewer lists them on its own; these runs prove the game loads with one.
	if (project.hasProperty("testJei")) {
		runtimeOnly "maven.modrinth:jei:${project.jei_version}"
		runtimeOnly "maven.modrinth:mezzconfig:${project.mezzconfig_version}"
	}
	// Lootr turns loot chests into per-player ones; ours are vanilla chests with loot tables,
	// placed by jigsaw templates like vanilla's, so it should take them. -PtestLootr proves it.
	if (project.hasProperty("testLootr")) {
		runtimeOnly "maven.modrinth:lootr:${project.lootr_version}"
	}
	if (project.hasProperty("testRei")) {
		runtimeOnly "maven.modrinth:rei:${project.rei_version}"
		runtimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
		runtimeOnly "maven.modrinth:architectury-api:${project.architectury_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "beyond_the_dragon_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
