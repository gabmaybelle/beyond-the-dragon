plugins {
	id 'fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"beyond_the_dragon" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 ships obfuscated (26.x ships Mojang names); the code is written in Mojang names and Loom remaps.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compatibility runs: `./gradlew :fabric:runClientGameTest -PtestStellarity` (or -PtestNullscape)
	// plays the in-game test with that mod installed, fetched from Modrinth's maven by version id
	// (modRuntimeOnly: on 1.21.1 Loom has to remap them to the dev names, like the API). Nothing
	// here is bundled or required. BetterEnd is not among them on this branch: its last 1.21.1
	// builds (BetterEnd 21.0.11, BCLib 21.0.13, WorldWeaver 21.0.13, WunderLib 21.0.8) don't fit
	// each other (BCLib asks WorldWeaver for a class it doesn't have), so none of them loads.
	if (project.hasProperty("testStellarity")) {
		modRuntimeOnly "maven.modrinth:stellarity:${project.stellarity_version}"
	}
	if (project.hasProperty("testNullscape")) {
		modRuntimeOnly "maven.modrinth:nullscape:${project.nullscape_version}"
	}
	// Waystones: a restored observatory sets a waystone when it's installed (reached through its
	// API by reflection, so it's never needed to build). -PtestWaystones checks it.
	if (project.hasProperty("testWaystones")) {
		modRuntimeOnly "maven.modrinth:waystones:${project.waystones_version}"
		modRuntimeOnly "maven.modrinth:balm:${project.balm_version}"
	}
	// Recipe viewers (each with what it needs): the recipes are plain crafting and smithing
	// JSON, so a viewer lists them on its own; these runs prove the game loads with one.
	if (project.hasProperty("testJei")) {
		modRuntimeOnly "maven.modrinth:jei:${project.jei_version}"
		modRuntimeOnly "maven.modrinth:mezzconfig:${project.mezzconfig_version}"
	}
	// Lootr turns loot chests into per-player ones; ours are vanilla chests with loot tables,
	// placed by jigsaw templates like vanilla's, so it should take them. -PtestLootr proves it.
	if (project.hasProperty("testLootr")) {
		modRuntimeOnly "maven.modrinth:lootr:${project.lootr_version}"
		modRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	}
	if (project.hasProperty("testRei")) {
		modRuntimeOnly "maven.modrinth:rei:${project.rei_version}"
		modRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
		modRuntimeOnly "maven.modrinth:architectury-api:${project.architectury_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The remapped jar is the one that ships (classic Loom remaps to intermediary); name them all.
base { archivesName = "${rootProject.name}-fabric" }

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar. Fabric's client game test API
// doesn't exist for 1.21.1, so the harness is the test's own (ClientGameTestContext and friends
// in src/gametest) and the run is a plain client run with the test source set as a second mod.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"beyond_the_dragon_gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		clientGameTest {
			client()
			name = "Client Game Test"
			source sourceSets.gametest
			runDir "build/run/clientGameTest"
			property "beyond_the_dragon.gametest", "true"
			// A fixed window so the screenshots are the same size on every machine.
			programArgs "--width", "1280", "--height", "720"
			ideConfigGenerated false
		}
	}
}
